[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-oasis-event-detection-library"
description = "OASIS fluorescence event detection for AIND ophys pipelines"
license = "MIT"
# Ceiling matches aind-pophys-metadata's requires-python.
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.0"

dependencies = [
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.2.0",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@v0.2.0",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/log-schema.git@f09685e#subdirectory=python",
    "oasis-deconv==0.3.2",
    # Newest scipy supporting Python 3.10.
    "scipy==1.15.3",
    "numpy==2.2.6",
    "h5py==3.16.0",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "pydantic==2.11.10",
    "pydantic-settings==2.14.2",
    "pytz==2026.3.post1",
]

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

# events.py + job.py are temporarily omitted from coverage: they were
# inherited from the production capsule, which shipped without unit tests, and
# are for now exercised by the Code Ocean data-run.
[tool.coverage.run]
omit = [
    "*/aind_ophys_oasis_event_detection_library/__init__.py",
    "*/aind_ophys_oasis_event_detection_library/utils/__init__.py",
    "*/aind_ophys_oasis_event_detection_library/events.py",
    "*/aind_ophys_oasis_event_detection_library/job.py",
]
source = ["aind_ophys_oasis_event_detection_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 100
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
